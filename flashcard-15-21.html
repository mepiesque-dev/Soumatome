<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard — Hari 15–21</title>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #3d1a2e;
  --paper: #fff0f5;
  --card: #ffffff;
  --accent: #d63384;
  --accent2: #a855a0;
  --gold: #f4a7c3;
  --muted: #b07090;
  --border: #f0c8da;
  --green: #2ecc8a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  min-height: 100vh;
  color: var(--ink);
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(214,51,132,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(214,51,132,.05) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events: none;
  z-index: 0;
}
header {
  position: relative; z-index: 10;
  padding: 20px 24px 16px;
  border-bottom: 2px solid var(--border);
  background: var(--paper);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
}
.brand { font-family: 'Kaisei Tokumin', serif; font-size: 1.35rem; color: var(--accent); letter-spacing: -.01em; }
.brand span { color: var(--ink); }
.filter-bar {
  position: relative; z-index: 10;
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  background: var(--paper);
}
.filter-label { font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-right: 4px; }
.filter-btn {
  padding: 5px 14px; border: 1.5px solid var(--border); border-radius: 20px;
  background: transparent; font-family: 'DM Sans', sans-serif; font-size: .8rem; font-weight: 600;
  color: var(--ink); cursor: pointer; transition: all .18s; white-space: nowrap;
}
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.controls {
  position: relative; z-index: 10;
  padding: 12px 24px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.counter-text { font-size: .82rem; color: var(--muted); font-weight: 600; }
.counter-text strong { color: var(--ink); }
.ctrl-btns { display: flex; gap: 8px; }
.ctrl-btn {
  padding: 7px 16px; border: 1.5px solid var(--border); border-radius: 8px;
  background: var(--card); font-family: 'DM Sans', sans-serif; font-size: .8rem; font-weight: 600;
  cursor: pointer; transition: all .15s; color: var(--ink);
}
.ctrl-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.ctrl-btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.ctrl-btn.primary:hover { background: var(--accent); border-color: var(--accent); }
.progress-area { position: relative; z-index: 10; padding: 0 24px 8px; }
.prog-track { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg, #d63384, #f4a7c3); border-radius: 99px; transition: width .4s ease; }
.stats-row {
  position: relative; z-index: 10;
  display: flex; justify-content: center; gap: 24px; padding: 8px 24px 4px; text-align: center;
}
.stat-item { display: flex; flex-direction: column; gap: 2px; }
.stat-val { font-size: 1.3rem; font-weight: 800; }
.stat-val.know { color: var(--green); }
.stat-val.dunno { color: var(--accent); }
.stat-val.remain { color: var(--accent2); }
.stat-label { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stage {
  position: relative; z-index: 5;
  display: flex; justify-content: center; align-items: center;
  padding: 28px 24px;
  min-height: 320px;
}
.card-wrap {
  width: 100%; max-width: 520px; height: 290px;
  perspective: 1000px; cursor: pointer;
}
.card-inner {
  width: 100%; height: 100%;
  position: relative; transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.4,0,.2,1);
}
.card-wrap.flipped .card-inner { transform: rotateY(180deg); }
.card-face {
  position: absolute; inset: 0; backface-visibility: hidden;
  border-radius: 20px; padding: 28px 32px;
  display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  border: 2px solid var(--border);
  box-shadow: 0 8px 40px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.04);
}
.card-front { background: var(--card); }
.card-back { background: #3d1a2e; color: #fff; transform: rotateY(180deg); border-color: #3d1a2e; }
.card-day { font-size: .65rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
.card-back .card-day { color: var(--gold); }
.card-jp { font-family: 'Kaisei Tokumin', serif; font-size: 2rem; line-height: 1.25; color: var(--ink); margin-bottom: 8px; }
.card-read { font-size: .88rem; color: var(--muted); font-weight: 500; }
.card-hint { margin-top: 16px; font-size: .72rem; color: #ccc; display: flex; align-items: center; gap: 5px; }
.card-back .card-id { font-size: 1.4rem; font-weight: 700; color: #fff; line-height: 1.3; margin-bottom: 10px; }
.card-back .card-jp-small { font-family: 'Kaisei Tokumin', serif; font-size: 1rem; color: rgba(255,255,255,.6); }
.card-back .card-read-small { font-size: .8rem; color: rgba(255,255,255,.4); margin-top: 4px; }
.nav-row {
  position: relative; z-index: 10;
  display: flex; justify-content: center; align-items: center; gap: 16px; padding: 8px 24px 16px;
}
.nav-btn {
  width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--border);
  background: var(--card); font-size: 1.3rem; cursor: pointer; transition: all .18s;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}
.nav-btn:hover { transform: scale(1.08); border-color: var(--ink); }
.flip-btn {
  width: auto; height: auto; padding: 12px 32px; border-radius: 12px;
  font-family: 'DM Sans', sans-serif; font-size: .95rem; font-weight: 700;
  background: var(--ink); color: #fff; border: 2px solid var(--ink);
  box-shadow: 0 4px 16px rgba(0,0,0,.15);
}
.flip-btn:hover { background: var(--accent); border-color: var(--accent); transform: scale(1.03); }
.rating-row {
  position: relative; z-index: 10;
  display: flex; justify-content: center; gap: 12px; padding: 0 24px 32px;
}
.rate-btn {
  flex: 1; max-width: 180px; padding: 12px 20px; border-radius: 12px;
  border: 2px solid var(--border); background: var(--card);
  font-family: 'DM Sans', sans-serif; font-size: .88rem; font-weight: 700;
  cursor: pointer; transition: all .18s; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.rate-btn.know { color: var(--green); border-color: var(--green); }
.rate-btn.know:hover { background: var(--green); color: #fff; }
.rate-btn.dunno { color: var(--accent); border-color: var(--accent); }
.rate-btn.dunno:hover { background: var(--accent); color: #fff; }
#doneScreen {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: var(--paper); justify-content: center; align-items: center;
  text-align: center; padding: 40px; flex-direction: column; gap: 16px;
}
#doneScreen.show { display: flex; }
.done-emoji { font-size: 4rem; }
.done-title { font-family: 'Kaisei Tokumin', serif; font-size: 2.2rem; color: var(--ink); }
.done-score { font-size: 1.1rem; color: var(--muted); }
.done-score strong { color: var(--accent); font-size: 1.8rem; }
.done-btns { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
.done-btn {
  padding: 12px 28px; border-radius: 12px; border: none;
  font-family: 'DM Sans', sans-serif; font-size: .95rem; font-weight: 700;
  cursor: pointer; transition: all .15s;
}
.done-btn.retry { background: var(--accent); color: #fff; }
.done-btn.review { background: var(--ink); color: #fff; }
.done-btn:hover { opacity: .85; transform: scale(.98); }
@keyframes swipeHint { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
.hint-anim { animation: swipeHint 2s ease-in-out infinite; }
@keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
.card-enter { animation: cardIn .3s ease forwards; }
@media (max-width: 480px) {
  .card-jp { font-size: 1.55rem; }
  .card-wrap { height: 260px; }
  .card-back .card-id { font-size: 1.15rem; }
  .filter-bar { gap: 6px; }
  .filter-btn { padding: 4px 10px; font-size: .75rem; }
}
</style>
</head>
<body>

<header>
  <div class="brand">単語カード <span>· Hari 15–21</span></div>
  <div style="font-size:.8rem;color:var(--muted);font-weight:600">228 kosakata</div>
</header>

<div class="filter-bar">
  <span class="filter-label">Hari:</span>
  <button class="filter-btn active" onclick="setFilter('all',this)">Semua</button>
  <button class="filter-btn" onclick="setFilter('15',this)">15 · Belanja</button>
  <button class="filter-btn" onclick="setFilter('16',this)">16 · Makan</button>
  <button class="filter-btn" onclick="setFilter('17',this)">17 · Minum</button>
  <button class="filter-btn" onclick="setFilter('18',this)">18 · Bayar</button>
  <button class="filter-btn" onclick="setFilter('19',this)">19 · Sekolah 1</button>
  <button class="filter-btn" onclick="setFilter('20',this)">20 · Sekolah 2</button>
  <button class="filter-btn" onclick="setFilter('21',this)">21 · Sekolah 3</button>
  <button class="filter-btn" onclick="setFilter('dunno',this)" style="border-color:var(--accent);color:var(--accent)">❌ Belum Hafal</button>
</div>

<div class="controls">
  <div class="counter-text">Kartu <strong id="cardNum">1</strong> dari <strong id="cardTotal">228</strong></div>
  <div class="ctrl-btns">
    <button class="ctrl-btn" onclick="toggleMode()">🔄 <span id="modeLabel">Tampilkan JP</span></button>
    <button class="ctrl-btn primary" onclick="shuffleDeck()">🔀 Acak</button>
  </div>
</div>

<div class="progress-area">
  <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
</div>

<div class="stats-row">
  <div class="stat-item"><div class="stat-val know" id="statKnow">0</div><div class="stat-label">✅ Hafal</div></div>
  <div class="stat-item"><div class="stat-val dunno" id="statDunno">0</div><div class="stat-label">❌ Belum</div></div>
  <div class="stat-item"><div class="stat-val remain" id="statRemain">228</div><div class="stat-label">⏳ Sisa</div></div>
</div>

<div class="stage">
  <div class="card-wrap" id="cardWrap" onclick="flipCard()">
    <div class="card-inner" id="cardInner">
      <div class="card-face card-front">
        <div class="card-day" id="frontDay"></div>
        <div class="card-jp" id="frontJp"></div>
        <div class="card-read" id="frontRead"></div>
        <div class="card-hint hint-anim">👆 Klik untuk lihat arti</div>
      </div>
      <div class="card-face card-back">
        <div class="card-day" id="backDay"></div>
        <div class="card-id" id="backId"></div>
        <div class="card-jp-small" id="backJp"></div>
        <div class="card-read-small" id="backRead"></div>
      </div>
    </div>
  </div>
</div>

<div class="nav-row">
  <button class="nav-btn" onclick="prevCard()" title="Sebelumnya">◀</button>
  <button class="flip-btn nav-btn" onclick="flipCard()">Balik Kartu</button>
  <button class="nav-btn" onclick="nextCard()" title="Berikutnya">▶</button>
</div>

<div class="rating-row">
  <button class="rate-btn dunno" onclick="rateCard(false)">❌ Belum Hafal</button>
  <button class="rate-btn know"  onclick="rateCard(true)">✅ Sudah Hafal</button>
</div>

<div id="doneScreen">
  <div class="done-emoji">🎉</div>
  <div class="done-title">Selesai!</div>
  <div class="done-score">Hafal: <strong id="doneKnow">0</strong> dari <span id="doneTotal">0</span> kartu</div>
  <div class="done-btns">
    <button class="done-btn retry" onclick="retryAll()">🔄 Ulangi Semua</button>
    <button class="done-btn review" onclick="reviewUnknown()">❌ Ulangi Belum Hafal</button>
  </div>
</div>

let deck = [...ALL_VOCAB];
let current = 0;
let isFlipped = false;
let showIdFirst = false;
let filterKey = 'all';
let knowSet = new Set();
let dunnoSet = new Set();

function setFilter(key, btn) {
  filterKey = key;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildDeck();
}

function buildDeck() {
  if (filterKey === 'all') {
    deck = [...ALL_VOCAB];
  } else if (filterKey === 'dunno') {
    const d = ALL_VOCAB.filter((_, i) => dunnoSet.has(i));
    if (d.length === 0) { alert('Belum ada kata yang ditandai ❌!'); return; }
    deck = d;
  } else {
    deck = ALL_VOCAB.filter(v => v.day.includes('Hari ' + filterKey));
  }
  current = 0; isFlipped = false;
  document.getElementById('cardWrap').classList.remove('flipped');
  renderCard();
}

function shuffleDeck() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  current = 0; isFlipped = false;
  document.getElementById('cardWrap').classList.remove('flipped');
  renderCard();
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('cardWrap').classList.toggle('flipped', isFlipped);
}

function prevCard() {
  if (current > 0) { current--; isFlipped = false; document.getElementById('cardWrap').classList.remove('flipped'); renderCard(); }
}

function nextCard() {
  if (current < deck.length - 1) { current++; isFlipped = false; document.getElementById('cardWrap').classList.remove('flipped'); renderCard(); }
  else showDone();
}

function rateCard(known) {
  const globalIdx = ALL_VOCAB.indexOf(deck[current]);
  if (known) { knowSet.add(globalIdx); dunnoSet.delete(globalIdx); }
  else { dunnoSet.add(globalIdx); knowSet.delete(globalIdx); }
  updateStats();
  nextCard();
}

function updateStats() {
  document.getElementById('statKnow').textContent = knowSet.size;
  document.getElementById('statDunno').textContent = dunnoSet.size;
  const sisa = Math.max(0, deck.length - current - 1);
  document.getElementById('statRemain').textContent = sisa;
}

function renderCard() {
  const v = deck[current];
  const total = deck.length;
  document.getElementById('progFill').style.width = ((current + 1) / total * 100) + '%';
  document.getElementById('cardNum').textContent = current + 1;
  document.getElementById('cardTotal').textContent = total;

  if (!showIdFirst) {
    document.getElementById('frontDay').textContent = v.day;
    document.getElementById('frontJp').textContent = v.jp;
    document.getElementById('frontRead').textContent = v.read;
    document.getElementById('backDay').textContent = v.day;
    document.getElementById('backId').textContent = v.id;
    document.getElementById('backJp').textContent = v.jp;
    document.getElementById('backRead').textContent = v.read;
  } else {
    document.getElementById('frontDay').textContent = v.day;
    document.getElementById('frontJp').textContent = v.id;
    document.getElementById('frontRead').textContent = '';
    document.getElementById('backDay').textContent = v.day;
    document.getElementById('backId').textContent = v.jp;
    document.getElementById('backJp').textContent = v.read;
    document.getElementById('backRead').textContent = '';
  }

  const wrap = document.getElementById('cardWrap');
  wrap.classList.remove('card-enter');
  void wrap.offsetWidth;
  wrap.classList.add('card-enter');
  updateStats();
}

function toggleMode() {
  showIdFirst = !showIdFirst;
  document.getElementById('modeLabel').textContent = showIdFirst ? 'Tampilkan ID' : 'Tampilkan JP';
  isFlipped = false;
  document.getElementById('cardWrap').classList.remove('flipped');
  renderCard();
}

function showDone() {
  document.getElementById('doneKnow').textContent = knowSet.size;
  document.getElementById('doneTotal').textContent = deck.length;
  document.getElementById('doneScreen').classList.add('show');
}

function retryAll() {
  document.getElementById('doneScreen').classList.remove('show');
  knowSet.clear(); dunnoSet.clear(); filterKey = 'all';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.filter-btn').classList.add('active');
  buildDeck();
}

function reviewUnknown() {
  document.getElementById('doneScreen').classList.remove('show');
  filterKey = 'dunno';
  buildDeck();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'l') nextCard();
  if (e.key === 'ArrowLeft'  || e.key === 'h') prevCard();
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
  if (e.key === 'y') rateCard(true);
  if (e.key === 'n') rateCard(false);
});

let tx = 0, ty = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) { dx < 0 ? nextCard() : prevCard(); }
}, {passive:true});

renderCard();
</script>
</body>
