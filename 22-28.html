<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Kotoba — Hari 22–28</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --coral:   #FF6B6B;
  --mint:    #2EC4B6;
  --coral-lt:#FFE8E8;
  --mint-lt: #E0F7F5;
  --coral-dk:#CC4444;
  --mint-dk: #1A9E93;
  --white:   #FFFFFF;
  --dark:    #1C2B2B;
  --gray:    #6B8080;
  --correct: #2EC4B6;
  --wrong:   #FF6B6B;
  --r: 18px;
}
*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:'Nunito',sans-serif;
  background: linear-gradient(160deg,#FFF5F5 0%,#F0FFFE 100%);
  min-height:100vh;
  padding:16px;
}

/* ── dots bg pattern ── */
body::before{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(circle,#FF6B6B22 1.5px,transparent 1.5px),
                   radial-gradient(circle,#2EC4B622 1.5px,transparent 1.5px);
  background-size:32px 32px,32px 32px;
  background-position:0 0,16px 16px;
  pointer-events:none;z-index:0;
}

.screen{display:none;position:relative;z-index:1;}
.screen.active{display:block;}

/* ══════════════ START ══════════════ */
#startScreen{max-width:460px;margin:20px auto;}

.brand{text-align:center;margin-bottom:20px;}
.brand-icon{font-size:3rem;display:block;margin-bottom:4px;}
.brand h1{
  font-family:'Baloo 2',cursive;font-size:1.9rem;font-weight:800;
  background:linear-gradient(135deg,var(--coral),var(--mint));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1.1;
}
.brand p{color:var(--gray);font-size:.88rem;font-weight:700;margin-top:4px;}

.card{
  background:var(--white);border-radius:24px;padding:28px 22px;
  box-shadow:0 8px 32px rgba(255,107,107,.12),0 2px 8px rgba(46,196,182,.1);
}

.section-label{
  font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--coral);margin-bottom:10px;
}

/* mode */
.mode-row{display:flex;gap:8px;margin-bottom:20px;}
.mode-btn{
  flex:1;padding:13px 6px;border:2.5px solid #eee;border-radius:14px;
  background:#fafafa;cursor:pointer;font-family:'Nunito',sans-serif;
  font-weight:700;font-size:.85rem;color:var(--dark);transition:all .2s;
  line-height:1.3;text-align:center;
}
.mode-btn.sel{background:var(--coral);border-color:var(--coral);color:#fff;}

/* count */
.count-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
.cnt-btn{
  flex:1;min-width:70px;padding:10px 6px;border:2.5px solid #eee;
  border-radius:12px;background:#fafafa;cursor:pointer;
  font-family:'Nunito',sans-serif;font-weight:700;font-size:.85rem;
  color:var(--dark);transition:all .2s;text-align:center;
}
.cnt-btn.sel{background:var(--mint);border-color:var(--mint);color:#fff;}

.start-btn{
  width:100%;padding:15px;border:none;border-radius:16px;
  background:linear-gradient(135deg,var(--coral) 0%,var(--mint) 100%);
  color:#fff;font-family:'Baloo 2',cursive;font-size:1.25rem;font-weight:700;
  cursor:pointer;box-shadow:0 6px 20px rgba(255,107,107,.3);
  transition:transform .15s,box-shadow .15s;
}
.start-btn:active{transform:scale(.97);}

.stat-chips{display:flex;gap:8px;margin-top:16px;}
.chip{
  flex:1;padding:8px 4px;border-radius:10px;text-align:center;
  font-size:.78rem;font-weight:800;
}
.chip-coral{background:var(--coral-lt);color:var(--coral-dk);}
.chip-mint {background:var(--mint-lt); color:var(--mint-dk);}

/* ══════════════ QUIZ ══════════════ */
#quizScreen{max-width:500px;margin:0 auto;}

/* topbar */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.score-pill{
  padding:6px 14px;border-radius:99px;font-weight:800;font-size:.85rem;
  white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.s-coral{background:var(--coral-lt);color:var(--coral-dk);}
.s-mint {background:var(--mint-lt); color:var(--mint-dk);}
.prog-wrap{flex:1;}
.prog-track{background:#e8f0ef;border-radius:99px;height:10px;overflow:hidden;}
.prog-fill{
  height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--coral),var(--mint));
  transition:width .4s cubic-bezier(.4,0,.2,1);
}
.prog-txt{font-size:.72rem;font-weight:800;color:var(--gray);text-align:right;margin-top:2px;}

/* question card */
.q-card{
  background:var(--white);border-radius:22px;
  padding:26px 20px 20px;margin-bottom:12px;
  box-shadow:0 6px 24px rgba(255,107,107,.1);
  border-top:4px solid var(--coral);
  animation:slideIn .3s ease;
}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.q-day{
  display:inline-block;padding:3px 10px;border-radius:99px;
  background:var(--mint-lt);color:var(--mint-dk);
  font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  margin-bottom:12px;
}
.q-main{
  font-size:1.55rem;font-weight:800;color:var(--dark);
  text-align:center;line-height:1.3;
}
.q-read{font-size:.9rem;color:var(--gray);text-align:center;margin-top:5px;font-weight:600;}

/* options */
.opts{display:flex;flex-direction:column;gap:9px;margin-bottom:10px;}
.opt{
  padding:13px 16px;border:2.5px solid #E8F0EF;border-radius:14px;
  background:#FAFEFE;cursor:pointer;font-family:'Nunito',sans-serif;
  font-weight:700;font-size:.9rem;color:var(--dark);text-align:left;
  transition:all .18s;line-height:1.4;
}
.opt:hover:not(:disabled){
  border-color:var(--coral);background:var(--coral-lt);
  transform:translateX(4px);
}
.opt.correct{background:var(--mint-lt);border-color:var(--mint);color:var(--mint-dk);}
.opt.wrong  {background:var(--coral-lt);border-color:var(--coral);color:var(--coral-dk);}
.opt:disabled{cursor:default;}

/* feedback */
.feedback{
  padding:11px 16px;border-radius:12px;font-weight:800;font-size:.88rem;
  text-align:center;margin-bottom:10px;display:none;animation:pop .2s ease;
}
@keyframes pop{from{transform:scale(.95)}to{transform:scale(1)}}
.feedback.show{display:block;}
.fb-ok{background:var(--mint-lt);color:var(--mint-dk);}
.fb-ng{background:var(--coral-lt);color:var(--coral-dk);}

.next-btn{
  width:100%;padding:13px;border:none;border-radius:14px;
  background:linear-gradient(135deg,var(--mint),var(--coral));
  color:#fff;font-family:'Baloo 2',cursive;font-size:1.05rem;font-weight:700;
  cursor:pointer;display:none;transition:opacity .2s;
}
.next-btn.show{display:block;}

/* ══════════════ RESULT ══════════════ */
#resultScreen{max-width:460px;margin:20px auto;}
.res-card{
  background:var(--white);border-radius:24px;padding:32px 22px;
  box-shadow:0 8px 32px rgba(46,196,182,.15);
  text-align:center;
}
.res-emoji{font-size:3.5rem;margin-bottom:8px;}
.res-title{font-family:'Baloo 2',cursive;font-size:1.8rem;font-weight:800;color:var(--dark);}
.res-pct{
  font-size:3.2rem;font-weight:800;margin:10px 0;
  background:linear-gradient(135deg,var(--coral),var(--mint));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.res-stars{font-size:1.8rem;margin-bottom:8px;}
.res-msg{color:var(--gray);font-size:.92rem;font-weight:700;margin-bottom:20px;}

.wrong-section{text-align:left;margin-bottom:18px;max-height:320px;overflow-y:auto;}
.wrong-section h3{
  font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--coral);margin-bottom:10px;
}
.wrong-item{
  background:var(--coral-lt);border-radius:12px;padding:10px 14px;
  margin-bottom:7px;font-size:.84rem;color:#883030;line-height:1.6;
}
.wrong-item b{color:var(--dark);}

.res-btns{display:flex;gap:10px;}
.res-btn{
  flex:1;padding:13px;border:none;border-radius:14px;
  font-family:'Baloo 2',cursive;font-size:1rem;font-weight:700;
  cursor:pointer;transition:transform .15s;
}
.res-btn:active{transform:scale(.97);}
.btn-retry{background:linear-gradient(135deg,var(--coral),#ff9f43);color:#fff;}
.btn-home {background:linear-gradient(135deg,var(--mint),#0096c7);color:#fff;}
</style>
</head>

<div id="quizScreen" class="screen">

</div>

<!-- ══════ RESULT ══════ -->

</div>

// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
let mode = 'jp-id';
let count = 204;
let qs = [];
let cur = 0;
let score = 0;
let wrongs = [];
let answered = false;

function setMode(m, btn) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
}
function setCount(n, btn) {
  count = n;
  document.querySelectorAll('.cnt-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuestions() {
  const pool = shuffle([...V]);
  return pool.slice(0, Math.min(count, V.length)).map(item => {
    const others = V.filter(v => v !== item);
    const distractors = shuffle(others).slice(0, 3);
    return { item, opts: shuffle([item, ...distractors]) };
  });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  qs = buildQuestions();
  cur = 0; score = 0; wrongs = [];
  showScreen('quizScreen');
  render();
}

function render() {
  answered = false;
  const { item, opts } = qs[cur];
  const total = qs.length;

  // progress
  document.getElementById('pFill').style.width = (cur / total * 100) + '%';
  document.getElementById('pTxt').textContent = `${cur + 1} / ${total}`;
  document.getElementById('sVal').textContent = score;
  document.getElementById('wVal').textContent = wrongs.length;

  // question
  document.getElementById('qDay').textContent = item.d;
  if (mode === 'jp-id') {
    document.getElementById('qMain').textContent = item.jp;
    document.getElementById('qRead').textContent = item.r;
  } else {
    document.getElementById('qMain').textContent = item.id;
    document.getElementById('qRead').textContent = '';
  }

  // options
  const box = document.getElementById('optsBox');
  box.innerHTML = '';
  opts.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'opt';
    if (mode === 'jp-id') {
      b.textContent = opt.id;
    } else {
      b.innerHTML = `${opt.jp} <span style="font-weight:600;color:#7aada8;font-size:.8em">(${opt.r})</span>`;
    }
    b.onclick = () => check(opt, item);
    box.appendChild(b);
  });

  // reset feedback
  const fb = document.getElementById('fbBar');
  fb.className = 'feedback';
  fb.textContent = '';
  document.getElementById('nxtBtn').className = 'next-btn';
}

function check(chosen, correct) {
  if (answered) return;
  answered = true;

  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    const isCorrect = b.textContent.includes(correct.id) || b.textContent.includes(correct.jp);
    const isChosen  = b.textContent.includes(chosen.id)  || b.textContent.includes(chosen.jp);
    if (isCorrect) b.classList.add('correct');
    if (isChosen && chosen !== correct) b.classList.add('wrong');
  });

  const fb = document.getElementById('fbBar');
  if (chosen === correct) {
    score++;
    fb.textContent = '✅ Benar!';
    fb.className = 'feedback show fb-ok';
  } else {
    wrongs.push({ correct, chosen });
    const ans = mode === 'jp-id' ? correct.id : `${correct.jp} (${correct.r})`;
    fb.textContent = `❌ Jawaban: ${ans}`;
    fb.className = 'feedback show fb-ng';
  }
  document.getElementById('nxtBtn').className = 'next-btn show';
}

function next() {
  cur++;
  if (cur >= qs.length) { showResult(); return; }
  render();
}

function showResult() {
  showScreen('resultScreen');
  const total = qs.length;
  const pct = Math.round(score / total * 100);

  let emoji='🎉', stars='⭐⭐⭐⭐⭐', msg='Luar biasa! Nilai sempurna!';
  if (pct < 40)      { emoji='😢'; stars='⭐';         msg='Jangan menyerah, ayo belajar lagi!'; }
  else if (pct < 60) { emoji='😅'; stars='⭐⭐';       msg='Lumayan! Masih bisa lebih baik!'; }
  else if (pct < 75) { emoji='🙂'; stars='⭐⭐⭐';     msg='Bagus! Terus semangat!'; }
  else if (pct < 90) { emoji='😊'; stars='⭐⭐⭐⭐';   msg='Keren banget! Hampir sempurna!'; }

  document.getElementById('rEmoji').textContent = emoji;
  document.getElementById('rPct').textContent   = `${score} / ${total}  (${pct}%)`;
  document.getElementById('rStars').textContent = stars;
  document.getElementById('rMsg').textContent   = msg;

  const ws = document.getElementById('wrongSec');
  if (!wrongs.length) { ws.innerHTML = ''; return; }

  ws.innerHTML = `<h3>Perlu Diulang (${wrongs.length} kata)</h3>` +
    wrongs.map(w => {
      const qLabel  = mode === 'jp-id' ? w.correct.jp : w.correct.id;
      const correct = mode === 'jp-id' ? w.correct.id : `${w.correct.jp} (${w.correct.r})`;
      const chosen  = mode === 'jp-id' ? w.chosen.id  : w.chosen.jp;
      return `<div class="wrong-item">
        <b>${qLabel}</b><br>
        ✅ ${correct}<br>
        ❌ Kamu pilih: ${chosen}
      </div>`;
    }).join('');
}

function goHome() { showScreen('startScreen'); }
