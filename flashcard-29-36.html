<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard Bahasa Jepang - Hari 29-36</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --kuning: #FFD93D;
    --kuning-gelap: #E6B800;
    --kuning-muda: #FFF5B7;
    --biru: #4FC3F7;
    --biru-gelap: #0288D1;
    --biru-muda: #E1F5FE;
    --putih: #FFFFFF;
    --teks-gelap: #1A237E;
    --abu: #607D8B;
    --bg: #F0F9FF;
  }

  body {
    font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    padding: 0;
    color: var(--teks-gelap);
  }

  header {
    background: var(--kuning);
    padding: 16px 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 4px solid var(--kuning-gelap);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--teks-gelap);
    letter-spacing: -0.3px;
  }

  .header-sub {
    font-size: 12px;
    color: #37474F;
    margin-top: 2px;
  }

  .badge-total {
    background: var(--biru-gelap);
    color: white;
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 13px;
    font-weight: 700;
  }

  .filter-bar {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    background: var(--putih);
    border-bottom: 1px solid #B3E5FC;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }

  .filter-btn {
    white-space: nowrap;
    padding: 6px 14px;
    border-radius: 20px;
    border: 2px solid var(--biru);
    background: var(--putih);
    color: var(--biru-gelap);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .filter-btn.active, .filter-btn:hover {
    background: var(--biru);
    color: var(--putih);
  }

  .progress-bar {
    height: 4px;
    background: #B3E5FC;
    width: 100%;
  }
  .progress-fill {
    height: 100%;
    background: var(--kuning-gelap);
    transition: width 0.4s;
  }

  .counter-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    font-size: 13px;
    color: var(--abu);
    background: var(--putih);
    border-bottom: 1px solid #E0F7FA;
  }
  .counter-num {
    font-weight: 700;
    color: var(--teks-gelap);
  }

  .card-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
    min-height: calc(100vh - 200px);
  }

  .flashcard {
    width: 100%;
    max-width: 460px;
    height: 240px;
    perspective: 1000px;
    cursor: pointer;
    margin-bottom: 20px;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .card-inner.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    padding: 24px;
    text-align: center;
  }

  .card-front {
    background: var(--kuning);
    border: 3px solid var(--kuning-gelap);
    box-shadow: 0 6px 24px rgba(255, 200, 0, 0.3);
  }

  .card-back {
    background: var(--biru);
    border: 3px solid var(--biru-gelap);
    box-shadow: 0 6px 24px rgba(79, 195, 247, 0.35);
    transform: rotateY(180deg);
    color: var(--putih);
  }

  .card-hari {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--abu);
    margin-bottom: 8px;
    background: rgba(255,255,255,0.5);
    padding: 2px 10px;
    border-radius: 10px;
  }

  .card-kanji {
    font-size: 36px;
    font-weight: 700;
    color: var(--teks-gelap);
    line-height: 1.2;
    margin-bottom: 4px;
  }

  .card-reading {
    font-size: 15px;
    color: #455A64;
    margin-bottom: 4px;
  }

  .card-hint {
    font-size: 12px;
    color: #78909C;
    margin-top: 8px;
  }

  .card-arti {
    font-size: 22px;
    font-weight: 700;
    color: var(--putih);
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .card-context {
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    line-height: 1.4;
  }

  .card-tap {
    font-size: 12px;
    color: rgba(0,0,0,0.35);
    margin-top: 10px;
    font-style: italic;
  }

  .nav-buttons {
    display: flex;
    gap: 12px;
    align-items: center;
    width: 100%;
    max-width: 460px;
  }

  .nav-btn {
    flex: 1;
    padding: 13px;
    border-radius: 14px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.3px;
  }

  .btn-prev {
    background: var(--putih);
    color: var(--teks-gelap);
    border: 2px solid var(--kuning-gelap);
  }
  .btn-prev:hover { background: var(--kuning-muda); }

  .btn-next {
    background: var(--kuning);
    color: var(--teks-gelap);
    border: 2px solid var(--kuning-gelap);
  }
  .btn-next:hover { background: var(--kuning-gelap); }

  .btn-flip {
    flex: 2;
    background: var(--biru-gelap);
    color: white;
  }
  .btn-flip:hover { background: #01579B; }

  .shortcut-hint {
    text-align: center;
    font-size: 11px;
    color: var(--abu);
    margin-top: 12px;
  }

  .done-overlay {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }
  .done-overlay.show { display: block; }

  .done-emoji { font-size: 56px; margin-bottom: 12px; }
  .done-title { font-size: 22px; font-weight: 700; color: var(--teks-gelap); margin-bottom: 8px; }
  .done-sub { font-size: 14px; color: var(--abu); margin-bottom: 20px; }
  .btn-restart {
    background: var(--kuning);
    border: 2px solid var(--kuning-gelap);
    padding: 12px 28px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: var(--teks-gelap);
  }

  @media (max-width: 480px) {
    .card-kanji { font-size: 28px; }
    .flashcard { height: 210px; }
  }
</style>
</head>

<header>
  <div>
    <div class="header-title">🇯🇵 Flashcard Jepang</div>
    <div class="header-sub">Hari 29–36 · Berbagai Topik</div>
  </div>
  <div class="badge-total" id="badge-total">275 kata</div>
</header>

<div class="filter-bar" id="filter-bar"></div>

<div class="progress-bar">
  <div class="progress-fill" id="progress-fill"></div>
</div>
<div class="counter-bar">
  <span><span class="counter-num" id="cur-num">1</span> / <span id="total-num">275</span></span>
  <span id="topic-label"></span>
</div>

<div class="card-area" id="card-area">
  <div class="flashcard" id="flashcard" onclick="flipCard()">
    <div class="card-inner" id="card-inner">
      <div class="card-face card-front" id="front-face">
        <div class="card-hari" id="front-hari"></div>
        <div class="card-kanji" id="front-kanji"></div>
        <div class="card-reading" id="front-reading"></div>
        <div class="card-hint">ketuk untuk lihat arti ↓</div>
      </div>
      <div class="card-face card-back" id="back-face">
        <div class="card-hari" id="back-hari" style="background:rgba(255,255,255,0.2);color:rgba(255,255,255,0.9)"></div>
        <div class="card-arti" id="back-arti"></div>
        <div class="card-context" id="back-context"></div>
      </div>
    </div>
  </div>

  <div class="nav-buttons">
    <button class="nav-btn btn-prev" onclick="prevCard()">← Prev</button>
    <button class="nav-btn nav-btn btn-flip" onclick="flipCard()">Balik Kartu</button>
    <button class="nav-btn btn-next" onclick="nextCard()">Next →</button>
  </div>
  <div class="shortcut-hint">Tekan ← → atau Spasi untuk navigasi</div>

  <div class="done-overlay" id="done-overlay">
    <div class="done-emoji">🎉</div>
    <div class="done-title">Selesai!</div>
    <div class="done-sub">Semua kata di topik ini sudah dipelajari</div>
    <button class="btn-restart" onclick="restart()">Ulangi Lagi</button>
  </div>
</div>

const topics = ["Semua", ...new Set(data.map(d => d.hari.split('·')[0].trim()))];
let filtered = [...data];
let cur = 0;
let flipped = false;
let activeFilter = "Semua";

function buildFilters() {
  const bar = document.getElementById('filter-bar');
  topics.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (t === activeFilter ? ' active' : '');
    btn.textContent = t;
    btn.onclick = () => setFilter(t, btn);
    bar.appendChild(btn);
  });
}

function setFilter(name, btn) {
  activeFilter = name;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filtered = name === "Semua" ? [...data] : data.filter(d => d.hari.startsWith(name));
  cur = 0;
  document.getElementById('done-overlay').classList.remove('show');
  document.getElementById('flashcard').style.display = '';
  document.querySelectorAll('.nav-buttons > *').forEach(b => b.style.display = '');
  document.querySelector('.shortcut-hint').style.display = '';
  showCard();
}

function showCard() {
  if (cur >= filtered.length) {
    document.getElementById('flashcard').style.display = 'none';
    document.querySelectorAll('.nav-buttons > *').forEach(b => b.style.display = 'none');
    document.querySelector('.shortcut-hint').style.display = 'none';
    document.getElementById('done-overlay').classList.add('show');
    return;
  }
  flipped = false;
  document.getElementById('card-inner').classList.remove('flipped');
  const d = filtered[cur];
  document.getElementById('front-hari').textContent = d.hari;
  document.getElementById('front-kanji').textContent = d.jp;
  document.getElementById('front-reading').textContent = d.reading || '\u3000';
  document.getElementById('back-hari').textContent = d.hari;
  document.getElementById('back-arti').textContent = d.arti;
  document.getElementById('back-context').textContent = d.reading ? d.reading : '';
  document.getElementById('cur-num').textContent = cur + 1;
  document.getElementById('total-num').textContent = filtered.length;
  document.getElementById('topic-label').textContent = d.hari.split('·')[1] ? d.hari.split('·')[1].trim() : '';
  document.getElementById('badge-total').textContent = filtered.length + ' kata';
  const pct = ((cur + 1) / filtered.length * 100).toFixed(0);
  document.getElementById('progress-fill').style.width = pct + '%';
}

function flipCard() {
  flipped = !flipped;
  document.getElementById('card-inner').classList.toggle('flipped', flipped);
}

function nextCard() {
  if (cur < filtered.length) cur++;
  showCard();
}

function prevCard() {
  if (cur > 0) cur--;
  showCard();
}

function restart() {
  cur = 0;
  document.getElementById('done-overlay').classList.remove('show');
  document.getElementById('flashcard').style.display = '';
  document.querySelectorAll('.nav-buttons > *').forEach(b => b.style.display = '');
  document.querySelector('.shortcut-hint').style.display = '';
  showCard();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextCard();
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevCard();
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
});

buildFilters();
showCard();
</script>
</body>
</html>
