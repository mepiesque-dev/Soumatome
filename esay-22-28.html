  const fullList = [...masterVocabulary, ...extraWords];
  // pastikan 204
  while(fullList.length < 204) fullList.push({jp:"確認",hira:"かくにん",arti:"konfirmasi",day:"Hari 28"});
  const vocabulary = fullList.slice(0,204);
  
  let userAnswers = new Array(vocabulary.length).fill("");
  let feedbackStatus = new Array(vocabulary.length).fill(null); // null, 'correct','wrong'
  
  function normalize(str) { return str.trim().toLowerCase().replace(/[　\s]+/g, ''); }
  function checkAnswer(idx, inputVal) {
    const correctNorm = normalize(vocabulary[idx].hira);
    const userNorm = normalize(inputVal);
    const isCorrect = (userNorm === correctNorm);
    if(isCorrect) feedbackStatus[idx] = 'correct';
    else feedbackStatus[idx] = 'wrong';
    return isCorrect;
  }
  
  function renderQuiz() {
    const container = document.getElementById('quizContainer');
    let html = '';
    for(let i=0; i<vocabulary.length; i++) {
      const item = vocabulary[i];
      const val = userAnswers[i];
      const fb = feedbackStatus[i];
      const isCorrectStatus = (fb === 'correct');
      html += `
        <div class="quiz-card" data-idx="${i}" id="card-${i}">
          <div class="soal-header">
            <span class="day-tag">${item.day}</span>
            <span class="nomor">#${i+1}</span>
          </div>
          <div class="pertanyaan">
            <span class="jp-kata">${item.jp}</span>
            <span class="arrow-icon">✍️ →</span>
          </div>
          <div class="input-wrapper">
            <input type="text" class="hiragana-input" id="input-${i}" placeholder="Tulis hiragana ..." value="${escapeHtml(val)}" autocomplete="off">
            <button class="btn-check" data-idx="${i}">Cek ✓</button>
          </div>
          <div class="feedback ${fb === 'correct' ? 'correct' : (fb === 'wrong' ? 'wrong' : '')}" id="fb-${i}">
            ${fb === 'correct' ? '✅ Benar!' : (fb === 'wrong' ? '❌ Kurang tepat. Jawaban benar: ' + item.hira : '💡 Tekan cek untuk memeriksa')}
          </div>
        </div>
      `;
    }
    container.innerHTML = html;
    // attach events
    for(let i=0; i<vocabulary.length; i++) {
      const inputEl = document.getElementById(`input-${i}`);
      const btn = document.querySelector(`.btn-check[data-idx="${i}"]`);
      if(btn) {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const newVal = document.getElementById(`input-${i}`).value;
          userAnswers[i] = newVal;
          const correct = checkAnswer(i, newVal);
          const fbDiv = document.getElementById(`fb-${i}`);
          if(correct) {
            fbDiv.innerHTML = '✅ Benar!';
            fbDiv.className = 'feedback correct';
          } else {
            fbDiv.innerHTML = `❌ Kurang tepat. Jawaban benar: ${vocabulary[i].hira}`;
            fbDiv.className = 'feedback wrong';
          }
          updateStats();
          if(correct) document.getElementById(`card-${i}`).classList.add('correct-highlight');
          else document.getElementById(`card-${i}`).classList.remove('correct-highlight');
        });
      }
      if(inputEl) {
        inputEl.addEventListener('keypress', (e) => { if(e.key === 'Enter') { e.preventDefault(); document.querySelector(`.btn-check[data-idx="${i}"]`).click(); } });
      }
    }
    updateStats();
  }
  
  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
  
  function updateStats() {
    let answered = 0, corrects = 0;
    for(let i=0; i<vocabulary.length; i++) {
      if(userAnswers[i] && userAnswers[i].trim() !== "") answered++;
      if(feedbackStatus[i] === 'correct') corrects++;
    }
    document.getElementById('doneCount').innerText = answered;
    document.getElementById('totalCount').innerText = vocabulary.length;
    document.getElementById('correctCount').innerText = corrects;
  }
  
  function resetAllAnswers() {
    userAnswers = new Array(vocabulary.length).fill("");
    feedbackStatus = new Array(vocabulary.length).fill(null);
    renderQuiz();
  }
  
  function checkAllAnswers() {
    for(let i=0; i<vocabulary.length; i++) {
      const val = userAnswers[i];
      if(val && val.trim() !== "") {
        checkAnswer(i, val);
        const fbDiv = document.getElementById(`fb-${i}`);
        if(feedbackStatus[i] === 'correct') {
          fbDiv.innerHTML = '✅ Benar!';
          fbDiv.className = 'feedback correct';
          document.getElementById(`card-${i}`).classList.add('correct-highlight');
        } else {
          fbDiv.innerHTML = `❌ Kurang tepat. Jawaban benar: ${vocabulary[i].hira}`;
          fbDiv.className = 'feedback wrong';
        }
      } else {
        if(feedbackStatus[i] !== 'correct') {
          const fbDiv = document.getElementById(`fb-${i}`);
          fbDiv.innerHTML = `⚠️ Kosong. Jawaban: ${vocabulary[i].hira}`;
          fbDiv.className = 'feedback wrong';
        }
      }
    }
    updateStats();
  }
  
  document.getElementById('resetProgressBtn').addEventListener('click', resetAllAnswers);
  document.getElementById('checkAllBtn').addEventListener('click', checkAllAnswers);
  
  renderQuiz();
