<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Pilihan Ganda — Hari 15–21</title>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@400;700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --pink-dark:  #d63384;
  --pink-mid:   #e91e8c;
  --pink-light: #fce4f0;
  --pink-pale:  #fff0f7;
  --pink-border:#f0b8d8;
  --pink-soft:  #f8d0e8;
  --white:      #ffffff;
  --ink:        #3d1a2e;
  --muted:      #b07090;
  --green:      #22c97a;
  --green-bg:   #e8faf3;
  --red:        #e53e6d;
  --red-bg:     #fde8ef;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--pink-pale);
  min-height: 100vh;
  color: var(--ink);
}

/* ── PETAL DECO ── */
body::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 60% 40% at 10% 10%, rgba(214,51,132,.08) 0%, transparent 70%),
    radial-gradient(ellipse 50% 50% at 90% 90%, rgba(168,85,160,.07) 0%, transparent 70%);
}

/* ══ START SCREEN ══ */
#startScreen {
  position: relative; z-index: 10;
  max-width: 500px; margin: 0 auto;
  padding: 40px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 0;
}

.logo-wrap { text-align: center; margin-bottom: 28px; }
.logo-icon { font-size: 3rem; display: block; margin-bottom: 8px; }
.logo-title {
  font-family: 'Kaisei Tokumin', serif;
  font-size: 2rem; color: var(--pink-dark);
  line-height: 1.1;
}
.logo-sub { font-size: .9rem; color: var(--muted); font-weight: 600; margin-top: 6px; }

.start-card {
  background: var(--white);
  border-radius: 28px;
  padding: 32px 28px;
  width: 100%;
  box-shadow: 0 8px 40px rgba(214,51,132,.12), 0 2px 8px rgba(214,51,132,.06);
  border: 1.5px solid var(--pink-border);
}

.section-label {
  font-size: .72rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: .1em;
  color: var(--pink-dark); margin-bottom: 10px;
}

/* Filter hari */
.hari-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  margin-bottom: 24px;
}
.hari-btn {
  padding: 10px 6px; border: 2px solid var(--pink-border);
  border-radius: 12px; background: var(--pink-pale);
  font-family: 'DM Sans', sans-serif; font-size: .78rem; font-weight: 700;
  color: var(--muted); cursor: pointer; transition: all .18s;
  text-align: center; line-height: 1.3;
}
.hari-btn:hover { border-color: var(--pink-dark); color: var(--pink-dark); background: var(--pink-light); }
.hari-btn.sel { background: var(--pink-dark); border-color: var(--pink-dark); color: #fff; }

/* Mode arah soal */
.mode-row { display: flex; gap: 10px; margin-bottom: 24px; }
.mode-btn {
  flex: 1; padding: 12px 8px; border: 2px solid var(--pink-border);
  border-radius: 14px; background: var(--pink-pale);
  font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: .85rem;
  color: var(--muted); cursor: pointer; transition: all .2s; text-align: center;
}
.mode-btn:hover { border-color: var(--pink-dark); color: var(--pink-dark); }
.mode-btn.sel { background: var(--pink-dark); border-color: var(--pink-dark); color: #fff; }

/* Jumlah soal */
.count-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
.count-btn {
  padding: 8px 18px; border: 2px solid var(--pink-border);
  border-radius: 10px; background: var(--pink-pale);
  font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: .82rem;
  color: var(--muted); cursor: pointer; transition: all .18s;
}
.count-btn:hover { border-color: var(--pink-dark); color: var(--pink-dark); }
.count-btn.sel { background: var(--pink-dark); border-color: var(--pink-dark); color: #fff; }

.start-btn {
  width: 100%; padding: 16px; border: none; border-radius: 16px;
  background: linear-gradient(135deg, var(--pink-dark), #a855a0);
  color: #fff; font-family: 'Kaisei Tokumin', serif; font-size: 1.25rem;
  cursor: pointer; letter-spacing: .02em;
  box-shadow: 0 6px 24px rgba(214,51,132,.3);
  transition: transform .15s, box-shadow .15s;
}
.start-btn:active { transform: scale(.97); }

/* ══ QUIZ SCREEN ══ */
#quizScreen { display: none; position: relative; z-index: 10; max-width: 560px; margin: 0 auto; padding: 20px 16px; }

/* top bar */
.top-bar {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
}
.score-pill {
  background: var(--white); border: 1.5px solid var(--pink-border);
  border-radius: 99px; padding: 6px 14px;
  font-weight: 800; font-size: .85rem; color: var(--pink-dark);
  white-space: nowrap; box-shadow: 0 2px 8px rgba(214,51,132,.1);
}
.prog-wrap { flex: 1; }
.prog-track { height: 8px; background: var(--pink-soft); border-radius: 99px; overflow: hidden; }
.prog-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--pink-dark), #a855a0);
  border-radius: 99px; transition: width .4s ease;
}
.prog-lbl { font-size: .72rem; font-weight: 700; color: var(--muted); text-align: right; margin-top: 3px; }

/* question card */
.q-card {
  background: var(--white); border-radius: 20px;
  padding: 28px 24px 22px;
  border: 1.5px solid var(--pink-border);
  box-shadow: 0 6px 28px rgba(214,51,132,.1);
  margin-bottom: 14px;
}
.q-tag {
  display: inline-block; padding: 3px 12px;
  background: var(--pink-light); border-radius: 99px;
  font-size: .68rem; font-weight: 800; color: var(--pink-dark);
  letter-spacing: .08em; text-transform: uppercase; margin-bottom: 14px;
}
.q-text {
  font-family: 'Kaisei Tokumin', serif;
  font-size: 1.85rem; font-weight: 700;
  color: var(--ink); text-align: center; line-height: 1.25;
}
.q-read { font-size: .9rem; color: var(--muted); text-align: center; margin-top: 8px; font-weight: 500; }

/* options */
.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.opt {
  padding: 14px 18px; border: 2px solid var(--pink-border);
  border-radius: 14px; background: var(--white);
  font-family: 'DM Sans', sans-serif; font-weight: 600;
  font-size: .92rem; color: var(--ink); cursor: pointer;
  text-align: left; transition: all .15s; line-height: 1.4;
  display: flex; align-items: center; gap: 10px;
}
.opt:hover:not(:disabled) { border-color: var(--pink-dark); background: var(--pink-light); color: var(--pink-dark); transform: translateX(3px); }
.opt .opt-key {
  min-width: 26px; height: 26px; border-radius: 50%;
  background: var(--pink-soft); color: var(--pink-dark);
  font-size: .78rem; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.opt.correct { background: var(--green-bg); border-color: var(--green); color: #0a6640; }
.opt.correct .opt-key { background: var(--green); color: #fff; }
.opt.wrong { background: var(--red-bg); border-color: var(--red); color: #7a1030; }
.opt.wrong .opt-key { background: var(--red); color: #fff; }
.opt:disabled { cursor: default; transform: none; }

/* feedback */
.feedback {
  padding: 11px 18px; border-radius: 12px;
  font-weight: 700; font-size: .88rem; text-align: center;
  margin-bottom: 10px; display: none;
}
.feedback.show { display: block; }
.feedback.ok { background: var(--green-bg); color: #0a6640; border: 1.5px solid var(--green); }
.feedback.ng { background: var(--red-bg); color: #7a1030; border: 1.5px solid var(--red); }

.next-btn {
  width: 100%; padding: 13px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, var(--pink-dark), #a855a0);
  color: #fff; font-family: 'Kaisei Tokumin', serif; font-size: 1.05rem;
  cursor: pointer; display: none;
  box-shadow: 0 4px 16px rgba(214,51,132,.25);
  transition: opacity .2s;
}
.next-btn.show { display: block; }

/* ══ RESULT SCREEN ══ */
#resultScreen {
  display: none; position: relative; z-index: 10;
  max-width: 500px; margin: 0 auto; padding: 40px 16px;
  text-align: center;
}
.result-card {
  background: var(--white); border-radius: 28px;
  padding: 36px 28px;
  border: 1.5px solid var(--pink-border);
  box-shadow: 0 8px 40px rgba(214,51,132,.12);
}
.res-emoji { font-size: 3.8rem; margin-bottom: 10px; }
.res-title { font-family: 'Kaisei Tokumin', serif; font-size: 2rem; color: var(--pink-dark); margin-bottom: 8px; }
.res-score { font-size: 3rem; font-weight: 800; color: var(--ink); margin: 8px 0; }
.res-pct { font-size: 1rem; color: var(--muted); margin-bottom: 6px; }
.res-stars { font-size: 2rem; margin-bottom: 14px; }
.res-msg { color: var(--muted); font-size: .92rem; margin-bottom: 24px; }

/* wrong list */
.wrong-wrap { text-align: left; margin-bottom: 24px; max-height: 300px; overflow-y: auto; }
.wrong-head { font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--red); margin-bottom: 10px; }
.wrong-item {
  background: var(--red-bg); border-radius: 12px;
  padding: 10px 14px; margin-bottom: 8px;
  font-size: .85rem; color: #5a0e24; line-height: 1.5;
  border: 1px solid #f8bfce;
}
.wrong-item strong { color: var(--ink); }

.res-actions { display: flex; gap: 10px; }
.act-btn {
  flex: 1; padding: 13px; border: none; border-radius: 14px;
  font-family: 'Kaisei Tokumin', serif; font-size: 1rem; cursor: pointer; transition: transform .15s;
}
.act-btn:active { transform: scale(.97); }
.act-retry { background: linear-gradient(135deg, var(--pink-dark), #a855a0); color: #fff; }
.act-home  { background: var(--pink-light); color: var(--pink-dark); border: 2px solid var(--pink-border); }

/* Scrollbar */
.wrong-wrap::-webkit-scrollbar { width: 6px; }
.wrong-wrap::-webkit-scrollbar-track { background: var(--pink-pale); border-radius: 99px; }
.wrong-wrap::-webkit-scrollbar-thumb { background: var(--pink-border); border-radius: 99px; }

@media (max-width: 480px) {
  .q-text { font-size: 1.45rem; }
  .hari-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<!-- ═══════════════ START ═══════════════ -->
<div id="startScreen">
  <div class="logo-wrap">
    <span class="logo-icon">🌸</span>
    <div class="logo-title">Quiz Kotoba</div>
    <div class="logo-sub">Hari 15–21 · 228 Kosakata</div>
  </div>

  <div class="start-card">
    <div class="section-label">Pilih Hari</div>

      <button class="hari-btn" onclick="toggleHari('16',this)">Hari 16<br><small>Makan</small></button>

    <button class="start-btn" onclick="startQuiz()">🌸 Mulai Quiz!</button>
  </div>
</div>

<!-- ═══════════════ QUIZ ═══════════════ -->
<div id="quizScreen">
  <div class="top-bar">
    <div class="score-pill">✅ <span id="scoreVal">0</span> &nbsp;❌ <span id="wrongVal">0</span></div>
    <div class="prog-wrap">
      <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
      <div class="prog-lbl" id="progLbl">1 / 1</div>
    </div>
  </div>

  <div class="q-card">
    <div class="q-tag" id="qTag"></div>
    <div class="q-text" id="qText"></div>
    <div class="q-read" id="qRead"></div>
  </div>

  <div class="options" id="optionsBox"></div>
  <div class="feedback" id="feedbackBar"></div>
  <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Lanjut →</button>
</div>

<!-- ═══════════════ RESULT ═══════════════ -->
<div id="resultScreen">
  <div class="result-card">
    <div class="res-emoji" id="resEmoji"></div>
    <div class="res-title">Hasil Quiz</div>
    <div class="res-score" id="resScore"></div>
    <div class="res-pct" id="resPct"></div>
    <div class="res-stars" id="resStars"></div>
    <div class="res-msg" id="resMsg"></div>
    <div class="wrong-wrap" id="wrongList"></div>
    <div class="res-actions">
      <button class="act-btn act-retry" onclick="startQuiz()">🔄 Ulangi</button>
      <button class="act-btn act-home" onclick="goHome()">🏠 Menu</button>
    </div>
  </div>
</div>

// ══════════════════════════════
// SHUFFLE
// ══════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ══════════════════════════════
// BUILD QUESTIONS
// ══════════════════════════════
function buildQuestions() {
  // Filter vocab
  let pool = hariFilter === 'all'
    ? [...ALL_VOCAB]
    : ALL_VOCAB.filter(v => v.day.includes('Hari ' + hariFilter));

  // Guarantee every kata appears at least once as the correct answer
  const shuffledPool = shuffle(pool);
  const limit = Math.min(totalCount, shuffledPool.length);
  const chosen = shuffledPool.slice(0, limit);

  return chosen.map(item => {
    const others = ALL_VOCAB.filter(v => v !== item);
    const wrongs = shuffle(others).slice(0, 3);
    const opts = shuffle([item, ...wrongs]);
    return { item, opts };
  });
}

  ['startScreen','quizScreen','resultScreen'].forEach(s => {
    document.getElementById(s).style.display = 'none';
  });
  document.getElementById(id).style.display = id === 'startScreen' ? 'flex' : 'block';
}

  show('quizScreen');
  renderQ();
}

function goHome() { show('startScreen'); }

// ══════════════════════════════
// RENDER QUESTION
// ══════════════════════════════
function renderQ() {
  answered = false;
  const { item, opts } = questions[current];
  const total = questions.length;

  // progress
  document.getElementById('progFill').style.width = ((current) / total * 100) + '%';
  document.getElementById('progLbl').textContent = `${current + 1} / ${total}`;
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('wrongVal').textContent = wrongItems.length;

  // question
  document.getElementById('qTag').textContent = item.day;
  if (mode === 'jp-id') {
    document.getElementById('qText').textContent = item.jp;
    document.getElementById('qRead').textContent = item.read;
  } else {
    document.getElementById('qText').textContent = item.id;
    document.getElementById('qRead').textContent = '';
  }

  // options
  const box = document.getElementById('optionsBox');
  box.innerHTML = '';
  opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt-key">${KEYS[i]}</span>`;
    if (mode === 'jp-id') {
      btn.innerHTML += `<span>${opt.id}</span>`;
    } else {
      btn.innerHTML += `<span>${opt.jp} <span style="font-weight:400;color:#b07090;font-size:.82em">(${opt.read})</span></span>`;
    }
    btn.onclick = () => checkAnswer(opt, item);
    box.appendChild(btn);
  });

  // reset feedback
  const fb = document.getElementById('feedbackBar');
  fb.className = 'feedback'; fb.textContent = '';
  document.getElementById('nextBtn').className = 'next-btn';
}

// ══════════════════════════════
// CHECK ANSWER
// ══════════════════════════════
function checkAnswer(chosen, correct) {
  if (answered) return;
  answered = true;

  const btns = document.querySelectorAll('.opt');
  btns.forEach(btn => {
    btn.disabled = true;
    const txt = btn.textContent;
    if (txt.includes(correct.id) || txt.includes(correct.jp)) btn.classList.add('correct');
  });

  const fb = document.getElementById('feedbackBar');
  if (chosen === correct) {
    score++;
    fb.textContent = '✅ Benar! Bagus sekali!';
    fb.className = 'feedback show ok';
  } else {
    wrongItems.push({ correct, chosen });
    fb.className = 'feedback show ng';
    fb.textContent = mode === 'jp-id'
      ? `❌ Jawaban: ${correct.id}`
      : `❌ Jawaban: ${correct.jp} (${correct.read})`;
    btns.forEach(btn => {
      if (btn.textContent.includes(chosen.id) || btn.textContent.includes(chosen.jp)) btn.classList.add('wrong');
    });
  }
  document.getElementById('nextBtn').className = 'next-btn show';
}

// ══════════════════════════════
// NEXT / RESULT
// ══════════════════════════════
function nextQuestion() {
  current++;
  if (current >= questions.length) { showResult(); return; }
  renderQ();
}

function showResult() {
  show('resultScreen');
  const total = questions.length;
  const pct = Math.round(score / total * 100);
  let emoji='🎉', stars='⭐⭐⭐⭐⭐', msg='Sempurna! Kamu luar biasa! 🌸';
  if (pct < 40)      { emoji='😢'; stars='⭐'; msg='Yuk belajar lagi! Semangat ya! 💪'; }
  else if (pct < 60) { emoji='😅'; stars='⭐⭐'; msg='Lumayan! Masih bisa lebih baik! 🌸'; }
  else if (pct < 75) { emoji='🙂'; stars='⭐⭐⭐'; msg='Cukup bagus! Terus latihan ya!'; }
  else if (pct < 90) { emoji='😊'; stars='⭐⭐⭐⭐'; msg='Bagus banget! Hampir sempurna!'; }

  document.getElementById('resEmoji').textContent = emoji;
  document.getElementById('resScore').textContent = `${score} / ${total}`;
  document.getElementById('resPct').textContent = `Akurasi ${pct}%`;
  document.getElementById('resStars').textContent = stars;
  document.getElementById('resMsg').textContent = msg;

  const wl = document.getElementById('wrongList');
  if (wrongItems.length === 0) { wl.innerHTML = ''; return; }
  wl.innerHTML = `<div class="wrong-head">Perlu Diulang — ${wrongItems.length} kata</div>` +
    wrongItems.map(w => `
      <div class="wrong-item">
        <strong>${w.correct.jp}</strong> (${w.correct.read})<br>
        ✅ ${w.correct.id}<br>
        ❌ Kamu pilih: ${mode === 'jp-id' ? w.chosen.id : w.chosen.jp}
      </div>`).join('');
}

// Keyboard shortcut
document.addEventListener('keydown', e => {
  if (!answered) {
    const idx = ['a','b','c','d'].indexOf(e.key.toLowerCase());
    if (idx >= 0) {
      const btns = document.querySelectorAll('.opt');
      if (btns[idx]) btns[idx].click();
    }
  } else if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    const nb = document.getElementById('nextBtn');
    if (nb.classList.contains('show')) nextQuestion();
  }
});

// Init
show('startScreen');
</script>
</body>
