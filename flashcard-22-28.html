<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard Kotoba — Hari 22–28</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sun: #FFD93D;
    --sky: #6BCB77;
    --sun-dk: #E6B800;
    --sky-dk: #3A9E45;
    --sun-lt: #FFF8DC;
    --sky-lt: #EAFAF0;
    --white: #FFFFFF;
    --dark: #1A2B1A;
    --gray: #6B8F6B;
    --bg: #FFFEF0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    padding: 16px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 10%, #FFD93D33 0%, transparent 40%),
      radial-gradient(circle at 80% 90%, #6BCB7733 0%, transparent 40%);
    pointer-events: none; z-index: 0;
  }

  /* ── DOTS PATTERN ── */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(circle, #FFD93D44 1.5px, transparent 1.5px),
      radial-gradient(circle, #6BCB7744 1.5px, transparent 1.5px);
    background-size: 28px 28px, 28px 28px;
    background-position: 0 0, 14px 14px;
    pointer-events: none; z-index: 0;
  }

  .wrap { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; }

  /* ─────── HEADER ─────── */
  .header {
    text-align: center;
    padding: 20px 0 14px;
  }
  .header-icon { font-size: 2.8rem; display: block; margin-bottom: 4px; animation: bounce 2s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  .header h1 {
    font-size: 1.7rem; font-weight: 900;
    background: linear-gradient(135deg, var(--sun-dk) 0%, var(--sky-dk) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    line-height: 1.1;
  }
  .header p { color: var(--gray); font-size: .8rem; font-weight: 600; margin-top: 4px; }

  /* ─────── FILTER BAR ─────── */
  .filter-section {
    background: var(--white);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 20px rgba(106,203,119,.15);
    border: 2px solid var(--sky-lt);
  }
  .filter-label {
    font-size: .68rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    color: var(--sky-dk); margin-bottom: 8px;
  }
  .filter-chips {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;
  }
  .chip-btn {
    padding: 5px 11px; border-radius: 99px; border: 2px solid #e0ead0;
    background: #fafff4; font-family: 'Poppins', sans-serif;
    font-size: .73rem; font-weight: 700; color: var(--dark); cursor: pointer;
    transition: all .18s;
  }
  .chip-btn.active { background: var(--sky); border-color: var(--sky); color: #fff; }
  .chip-btn:hover:not(.active) { border-color: var(--sky); color: var(--sky-dk); }

  /* mode toggle */
  .mode-row { display: flex; gap: 8px; }
  .mode-btn {
    flex: 1; padding: 10px 6px; border-radius: 12px; border: 2px solid #e8e8d0;
    background: #fafff4; font-family: 'Poppins', sans-serif;
    font-size: .8rem; font-weight: 700; color: var(--dark); cursor: pointer;
    transition: all .18s; text-align: center;
  }
  .mode-btn.active { background: var(--sun); border-color: var(--sun-dk); color: var(--dark); }

  /* ─────── STATS ─────── */
  .stats-row {
    display: flex; gap: 8px; margin-bottom: 14px;
  }
  .stat-box {
    flex: 1; padding: 10px 8px; border-radius: 14px;
    text-align: center; font-weight: 800; font-size: .78rem;
  }
  .stat-sun { background: var(--sun-lt); color: var(--sun-dk); border: 2px solid #ffe066; }
  .stat-sky { background: var(--sky-lt); color: var(--sky-dk); border: 2px solid #b5e8bc; }
  .stat-num { font-size: 1.4rem; display: block; font-weight: 900; line-height: 1; }

  /* ─────── PROGRESS ─────── */
  .progress-bar {
    background: #e8f0e0; border-radius: 99px; height: 10px;
    overflow: hidden; margin-bottom: 14px;
  }
  .progress-fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--sun-dk), var(--sky));
    transition: width .4s cubic-bezier(.4,0,.2,1);
  }

  /* ─────── FLASHCARD ─────── */
  .card-area {
    perspective: 1200px; margin-bottom: 14px; cursor: pointer;
  }
  .card-inner {
    position: relative; width: 100%; min-height: 230px;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.4,0,.2,1);
  }
  .card-inner.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute; width: 100%;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 24px;
    padding: 30px 24px 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,.1), 0 2px 8px rgba(106,203,119,.15);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 230px;
  }

  .card-front {
    background: linear-gradient(145deg, var(--white) 0%, #FFFDF0 100%);
    border: 3px solid var(--sun);
    border-top: 6px solid var(--sun-dk);
  }
  .card-back {
    background: linear-gradient(145deg, var(--white) 0%, #F0FFF4 100%);
    border: 3px solid var(--sky);
    border-top: 6px solid var(--sky-dk);
    transform: rotateY(180deg);
  }

  .card-day {
    position: absolute; top: 14px; left: 16px;
    padding: 3px 10px; border-radius: 99px;
    font-size: .65rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  }
  .front-day { background: var(--sun-lt); color: var(--sun-dk); }
  .back-day  { background: var(--sky-lt); color: var(--sky-dk); }

  .card-hint {
    position: absolute; top: 14px; right: 16px;
    font-size: .7rem; font-weight: 700; color: #aaa; opacity: .7;
  }

  .card-main {
    font-family: 'Noto Sans JP', 'Poppins', sans-serif;
    font-size: 1.8rem; font-weight: 700; color: var(--dark);
    text-align: center; line-height: 1.3; margin-bottom: 8px;
  }
  .card-main.latin { font-family: 'Poppins', sans-serif; font-size: 1.4rem; }
  .card-read {
    font-size: .85rem; color: var(--gray); text-align: center; font-weight: 600;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .card-ans {
    font-size: 1.3rem; font-weight: 800; color: var(--sky-dk);
    text-align: center; line-height: 1.4;
  }
  .card-ans-sub {
    font-size: .8rem; color: var(--gray); margin-top: 5px; text-align: center; font-weight: 600;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .tap-hint {
    position: absolute; bottom: 14px; right: 16px;
    font-size: .65rem; color: #bbb; font-weight: 700; display: flex; align-items: center; gap: 3px;
  }

  /* ─────── BUTTONS ─────── */
  .action-row {
    display: flex; gap: 10px; margin-bottom: 14px;
  }
  .action-btn {
    flex: 1; padding: 13px 8px; border-radius: 16px; border: none;
    font-family: 'Poppins', sans-serif; font-size: .9rem; font-weight: 800;
    cursor: pointer; transition: all .18s; display: flex; align-items: center;
    justify-content: center; gap: 5px;
  }
  .btn-prev { background: #f0f0e0; color: #888; }
  .btn-prev:hover:not(:disabled) { background: #e5e5d0; }
  .btn-next { background: linear-gradient(135deg, var(--sun-dk), var(--sky-dk)); color: #fff;
    box-shadow: 0 4px 16px rgba(106,203,119,.3); }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(106,203,119,.4); }
  .btn-next:active { transform: translateY(0); }
  .action-btn:disabled { opacity: .4; cursor: default; }

  /* ─────── SHUFFLE & RESET ─────── */
  .util-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .util-btn {
    flex: 1; padding: 9px 6px; border-radius: 12px; border: 2px solid #e0e8d0;
    background: var(--white); font-family: 'Poppins', sans-serif;
    font-size: .78rem; font-weight: 700; color: var(--dark); cursor: pointer;
    transition: all .18s; text-align: center;
  }
  .util-btn:hover { border-color: var(--sky-dk); color: var(--sky-dk); }
  .util-btn.sun-btn:hover { border-color: var(--sun-dk); color: var(--sun-dk); }

  /* ─────── COMPLETE ─────── */
  #completeScreen { display: none; text-align: center; }
  .complete-card {
    background: var(--white); border-radius: 24px; padding: 36px 22px;
    box-shadow: 0 10px 40px rgba(106,203,119,.2);
    border: 3px solid var(--sky);
  }
  .complete-emoji { font-size: 4rem; display: block; margin-bottom: 12px; }
  .complete-title { font-size: 1.8rem; font-weight: 900; color: var(--dark); margin-bottom: 6px; }
  .complete-sub { color: var(--gray); font-size: .88rem; font-weight: 600; margin-bottom: 20px; }
  .complete-btn {
    padding: 14px 32px; border: none; border-radius: 16px;
    background: linear-gradient(135deg, var(--sun-dk), var(--sky-dk));
    color: #fff; font-family: 'Poppins', sans-serif; font-size: 1rem; font-weight: 800;
    cursor: pointer; box-shadow: 0 4px 16px rgba(106,203,119,.3);
  }

  /* ─────── COUNTER ─────── */
  .counter-txt {
    text-align: center; font-size: .75rem; font-weight: 700; color: var(--gray);
    margin-bottom: 6px;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    <span class="header-icon">🌟</span>
    <h1>Flashcard Kotoba<br>Hari 22–28</h1>
    <p>204 kata · Tap kartu untuk balik!</p>
  </div>

  <!-- FILTER -->
  <div class="filter-section">
    <div class="filter-label">Filter Hari / Topik</div>
    <div class="filter-chips" id="filterChips"></div>
    <div class="filter-label" style="margin-top:4px">Mode Tampilan</div>
    <div class="mode-row">
      <button class="mode-btn active" id="modeJpId" onclick="setMode('jp-id')">🇯🇵 Depan · 🇮🇩 Belakang</button>
      <button class="mode-btn" id="modeIdJp" onclick="setMode('id-jp')">🇮🇩 Depan · 🇯🇵 Belakang</button>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-box stat-sun">
      <span class="stat-num" id="statCur">1</span>
      Kartu ke
    </div>
    <div class="stat-box stat-sky">
      <span class="stat-num" id="statTotal">204</span>
      Total Kata
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-bar">
    <div class="progress-fill" id="progFill" style="width:0%"></div>
  </div>
  <div class="counter-txt" id="counterTxt">1 / 204</div>

  <!-- FLASHCARD -->
  <div id="mainApp">
    <div class="card-area" onclick="flipCard()">
      <div class="card-inner" id="cardInner">
        <!-- FRONT -->
        <div class="card-face card-front">
          <div class="card-day front-day" id="cardDay">—</div>
          <div class="card-hint" id="cardHint">Tap untuk lihat arti →</div>
          <div class="card-main" id="cardMain">...</div>
          <div class="card-read" id="cardRead"></div>
          <div class="tap-hint">👆 tap</div>
        </div>
        <!-- BACK -->
        <div class="card-face card-back">
          <div class="card-day back-day" id="cardDayB">—</div>
          <div class="card-ans" id="cardAns">...</div>
          <div class="card-ans-sub" id="cardAnsSub"></div>
          <div class="tap-hint">👆 tap balik</div>
        </div>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="action-row">
      <button class="action-btn btn-prev" id="btnPrev" onclick="prevCard()">← Prev</button>
      <button class="action-btn btn-next" id="btnNext" onclick="nextCard()">Next →</button>
    </div>

    <!-- UTIL -->
    <div class="util-row">
      <button class="util-btn sun-btn" onclick="shuffleCards()">🔀 Acak Urutan</button>
      <button class="util-btn" onclick="resetAll()">🔄 Reset</button>
    </div>
  </div>

  <!-- COMPLETE -->
  <div id="completeScreen">
    <div class="complete-card">
      <span class="complete-emoji">🎉</span>
      <div class="complete-title">Selesai!</div>
      <div class="complete-sub" id="completeMsg">Semua kartu sudah dipelajari!</div>
      <button class="complete-btn" onclick="resetAll()">🔄 Ulangi Lagi</button>
    </div>
  </div>

</div>

// ── STATE ──
let mode = 'jp-id';
let allCards = [...V];
let filtered = [...V];
let cur = 0;
let isFlipped = false;
let activeFilters = new Set(['semua']);

// ── FILTERS ──
const TOPICS = ['semua','Hari 22','Hari 23','Hari 24','Hari 25','Hari 26','Hari 27','Hari 28'];

function buildFilters() {
  const wrap = document.getElementById('filterChips');
  wrap.innerHTML = '';
  TOPICS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'chip-btn' + (t === 'semua' ? ' active' : '');
    b.textContent = t === 'semua' ? '🌈 Semua (' + V.length + ')' : t + ' (' + V.filter(v => v.d.startsWith(t)).length + ')';
    b.onclick = () => toggleFilter(t, b);
    wrap.appendChild(b);
  });
}

function toggleFilter(t, btn) {
  if (t === 'semua') {
    activeFilters = new Set(['semua']);
    document.querySelectorAll('.chip-btn').forEach((b,i) => b.classList.toggle('active', i===0));
  } else {
    activeFilters.delete('semua');
    document.querySelector('.chip-btn').classList.remove('active');
    if (activeFilters.has(t)) {
      activeFilters.delete(t);
      btn.classList.remove('active');
      if (activeFilters.size === 0) { activeFilters.add('semua'); document.querySelector('.chip-btn').classList.add('active'); }
    } else {
      activeFilters.add(t);
      btn.classList.add('active');
    }
  }
  applyFilter();
}

function applyFilter() {
  if (activeFilters.has('semua')) {
    filtered = [...V];
  } else {
    filtered = V.filter(v => [...activeFilters].some(f => v.d.startsWith(f)));
  }
  cur = 0;
  document.getElementById('completeScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  render();
}

function setMode(m) {
  mode = m;
  document.getElementById('modeJpId').classList.toggle('active', m === 'jp-id');
  document.getElementById('modeIdJp').classList.toggle('active', m === 'id-jp');
  render();
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('cardInner').classList.toggle('flipped', isFlipped);
}

function render() {
  isFlipped = false;
  document.getElementById('cardInner').classList.remove('flipped');

  const item = filtered[cur];
  const total = filtered.length;

  // stats
  document.getElementById('statCur').textContent = cur + 1;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('counterTxt').textContent = (cur+1) + ' / ' + total;

  // progress
  document.getElementById('progFill').style.width = ((cur+1)/total*100) + '%';

  // front
  document.getElementById('cardDay').textContent = item.d;
  document.getElementById('cardDayB').textContent = item.d;

  if (mode === 'jp-id') {
    document.getElementById('cardMain').textContent = item.jp;
    document.getElementById('cardMain').className = 'card-main';
    document.getElementById('cardRead').textContent = item.r;
    document.getElementById('cardHint').textContent = 'Tap untuk lihat arti →';
    document.getElementById('cardAns').textContent = item.id;
    document.getElementById('cardAnsSub').textContent = '';
  } else {
    document.getElementById('cardMain').textContent = item.id;
    document.getElementById('cardMain').className = 'card-main latin';
    document.getElementById('cardRead').textContent = '';
    document.getElementById('cardHint').textContent = 'Tap untuk lihat kanji →';
    document.getElementById('cardAns').textContent = item.jp;
    document.getElementById('cardAnsSub').textContent = item.r;
  }

  // buttons
  document.getElementById('btnPrev').disabled = cur === 0;
  document.getElementById('btnNext').textContent = cur === total-1 ? 'Selesai ✓' : 'Next →';
}

function nextCard() {
  if (cur >= filtered.length - 1) {
    document.getElementById('mainApp').style.display = 'none';
    document.getElementById('completeScreen').style.display = 'block';
    document.getElementById('completeMsg').textContent = 'Semua ' + filtered.length + ' kartu selesai dipelajari! 🌟';
    return;
  }
  cur++;
  render();
}

function prevCard() {
  if (cur <= 0) return;
  cur--;
  render();
}

function shuffleCards() {
  for (let i = filtered.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
  }
  cur = 0;
  render();
}

function resetAll() {
  filtered = activeFilters.has('semua') ? [...V] : V.filter(v => [...activeFilters].some(f => v.d.startsWith(f)));
  cur = 0;
  document.getElementById('completeScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  render();
}

// keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextCard();
  if (e.key === 'ArrowLeft')  prevCard();
  if (e.key === ' ') { e.preventDefault(); flipCard(); }
});

// init
buildFilters();
render();
</script>
