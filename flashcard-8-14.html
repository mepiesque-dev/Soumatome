<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard — Hari 8–14</title>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a1a2e;
  --paper: #faf7f0;
  --card: #ffffff;
  --accent: #c0392b;
  --accent2: #2980b9;
  --gold: #e8a020;
  --muted: #888;
  --border: #e0dbd0;
  --green: #27ae60;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  min-height: 100vh;
  color: var(--ink);
  overflow-x: hidden;
}

/* ── GRID TEXTURE ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,0,0,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.03) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events: none;
  z-index: 0;
}

/* ── HEADER ── */
header {
  position: relative;
  z-index: 10;
  padding: 20px 24px 16px;
  border-bottom: 2px solid var(--border);
  background: var(--paper);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.brand {
  font-family: 'Kaisei Tokumin', serif;
  font-size: 1.35rem;
  color: var(--accent);
  letter-spacing: -.01em;
}
.brand span { color: var(--ink); }

/* ── FILTER BAR ── */
.filter-bar {
  position: relative;
  z-index: 10;
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  background: var(--paper);
}

.filter-label {
  font-size: .75rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-right: 4px;
}

.filter-btn {
  padding: 5px 14px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  background: transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: .8rem;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
  transition: all .18s;
  white-space: nowrap;
}
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ── CONTROLS ── */
.controls {
  position: relative;
  z-index: 10;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}

.counter-text {
  font-size: .82rem;
  color: var(--muted);
  font-weight: 600;
}
.counter-text strong { color: var(--ink); }

.ctrl-btns { display: flex; gap: 8px; }

.ctrl-btn {
  padding: 7px 16px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  font-family: 'DM Sans', sans-serif;
  font-size: .8rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  color: var(--ink);
}
.ctrl-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.ctrl-btn.primary {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}
.ctrl-btn.primary:hover { background: var(--accent); border-color: var(--accent); }

/* ── FLASHCARD STAGE ── */
.stage {
  position: relative;
  z-index: 5;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 32px 24px;
  min-height: 340px;
}

/* 3D flip */
.card-wrap {
  width: 100%;
  max-width: 520px;
  height: 300px;
  perspective: 1000px;
  cursor: pointer;
}

.card-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.4,0,.2,1);
}

.card-wrap.flipped .card-inner { transform: rotateY(180deg); }

.card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 20px;
  padding: 32px 36px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  border: 2px solid var(--border);
  box-shadow: 0 8px 40px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.04);
}

.card-front {
  background: var(--card);
}

.card-back {
  background: var(--ink);
  color: #fff;
  transform: rotateY(180deg);
  border-color: var(--ink);
}

.card-day {
  font-size: .65rem;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 16px;
}
.card-back .card-day { color: var(--gold); }

.card-jp {
  font-family: 'Kaisei Tokumin', serif;
  font-size: 2.4rem;
  line-height: 1.2;
  color: var(--ink);
  margin-bottom: 10px;
}

.card-read {
  font-size: .9rem;
  color: var(--muted);
  font-weight: 500;
}

.card-hint {
  margin-top: 18px;
  font-size: .72rem;
  color: #ccc;
  display: flex;
  align-items: center;
  gap: 5px;
}

/* Back face */
.card-back .card-id {
  font-size: 1.5rem;
  font-weight: 700;
  color: #fff;
  line-height: 1.3;
  margin-bottom: 12px;
}

.card-back .card-jp-small {
  font-family: 'Kaisei Tokumin', serif;
  font-size: 1.1rem;
  color: rgba(255,255,255,.6);
}

.card-back .card-read-small {
  font-size: .82rem;
  color: rgba(255,255,255,.4);
  margin-top: 4px;
}

/* ── PROGRESS BAR ── */
.progress-area {
  position: relative;
  z-index: 10;
  padding: 0 24px 8px;
}
.prog-track {
  height: 4px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--gold));
  border-radius: 99px;
  transition: width .4s ease;
}

/* ── NAV BUTTONS ── */
.nav-row {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  padding: 8px 24px 24px;
}

.nav-btn {
  width: 52px; height: 52px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--card);
  font-size: 1.3rem;
  cursor: pointer;
  transition: all .18s;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}
.nav-btn:hover { transform: scale(1.08); border-color: var(--ink); }

.flip-btn {
  width: auto; height: auto;
  padding: 12px 32px;
  border-radius: 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: .95rem;
  font-weight: 700;
  background: var(--ink);
  color: #fff;
  border: 2px solid var(--ink);
  box-shadow: 0 4px 16px rgba(0,0,0,.15);
}
.flip-btn:hover { background: var(--accent); border-color: var(--accent); transform: scale(1.03); }

/* ── KNOW / UNKNOWN BUTTONS ── */
.rating-row {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 0 24px 32px;
}

.rate-btn {
  flex: 1;
  max-width: 180px;
  padding: 12px 20px;
  border-radius: 12px;
  border: 2px solid var(--border);
  background: var(--card);
  font-family: 'DM Sans', sans-serif;
  font-size: .88rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .18s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.rate-btn.know { color: var(--green); border-color: var(--green); }
.rate-btn.know:hover { background: var(--green); color: #fff; }
.rate-btn.dunno { color: var(--accent); border-color: var(--accent); }
.rate-btn.dunno:hover { background: var(--accent); color: #fff; }

/* ── STATS ROW ── */
.stats-row {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: center;
  gap: 24px;
  padding: 0 24px 16px;
  text-align: center;
}
.stat-item { display: flex; flex-direction: column; gap: 2px; }
.stat-val { font-size: 1.3rem; font-weight: 800; }
.stat-val.know { color: var(--green); }
.stat-val.dunno { color: var(--accent); }
.stat-val.remain { color: var(--accent2); }
.stat-label { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

/* ── DONE SCREEN ── */
#doneScreen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--paper);
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 40px;
  flex-direction: column;
  gap: 16px;
}
#doneScreen.show { display: flex; }
.done-emoji { font-size: 4rem; }
.done-title { font-family: 'Kaisei Tokumin', serif; font-size: 2.2rem; color: var(--ink); }
.done-score { font-size: 1.1rem; color: var(--muted); }
.done-score strong { color: var(--accent); font-size: 1.8rem; }
.done-btns { display: flex; gap: 12px; margin-top: 8px; }
.done-btn {
  padding: 12px 28px;
  border-radius: 12px;
  border: none;
  font-family: 'DM Sans', sans-serif;
  font-size: .95rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
}
.done-btn.retry { background: var(--accent); color: #fff; }
.done-btn.review { background: var(--ink); color: #fff; }
.done-btn:hover { opacity: .85; transform: scale(.98); }

/* Swipe hint animation */
@keyframes swipeHint {
  0%,100% { opacity: 0.4; }
  50% { opacity: 1; }
}
.hint-anim { animation: swipeHint 2s ease-in-out infinite; }

/* Card enter animation */
@keyframes cardIn {
  from { opacity: 0; transform: translateY(14px) scale(.97); }
  to   { opacity: 1; transform: none; }
}
.card-enter { animation: cardIn .3s ease forwards; }

/* Responsive */
@media (max-width: 480px) {
  .card-jp { font-size: 1.8rem; }
  .card-wrap { height: 260px; }
  .card-back .card-id { font-size: 1.25rem; }
}
</style>
</head>

<header>
  <div class="brand">単語カード <span>· Hari 8–14</span></div>
  <div style="font-size:.8rem;color:var(--muted);font-weight:600">203 kosakata</div>
</header>

<!-- FILTER -->
<div class="filter-bar">
  <span class="filter-label">Hari:</span>
  <button class="filter-btn active" onclick="setFilter('all',this)">Semua</button>

  <button class="filter-btn" onclick="setFilter('Hari 14',this)">14 · Persiapan</button>
  <button class="filter-btn" onclick="setFilter('dunno',this)" style="margin-left:auto;border-color:var(--accent);color:var(--accent)">❌ Belum Hafal</button>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="counter-text">Kartu <strong id="cardNum">1</strong> dari <strong id="cardTotal">203</strong></div>
  <div class="ctrl-btns">
    <button class="ctrl-btn" onclick="toggleMode()">🔄 <span id="modeLabel">Tampilkan JP</span></button>
    <button class="ctrl-btn primary" onclick="shuffleDeck()">🔀 Acak</button>
  </div>
</div>

<!-- PROGRESS -->
<div class="progress-area">
  <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
</div>

<!-- STATS -->
<div class="stats-row">
  <div class="stat-item">
    <div class="stat-val know" id="statKnow">0</div>
    <div class="stat-label">✅ Hafal</div>
  </div>
  <div class="stat-item">
    <div class="stat-val dunno" id="statDunno">0</div>
    <div class="stat-label">❌ Belum</div>
  </div>
  <div class="stat-item">
    <div class="stat-val remain" id="statRemain">203</div>
    <div class="stat-label">⏳ Sisa</div>
  </div>
</div>

<!-- CARD -->
<div class="stage">
  <div class="card-wrap" id="cardWrap" onclick="flipCard()">
    <div class="card-inner" id="cardInner">

      <div class="card-face card-front">

        <div class="card-jp" id="frontJp"></div>
        <div class="card-read" id="frontRead"></div>

        <div class="card-id" id="backId"></div>
        <div class="card-jp-small" id="backJp"></div>
        <div class="card-read-small" id="backRead"></div>
      </div>
    </div>
  </div>
</div>

<!-- NAV -->
<div class="nav-row">
  <button class="nav-btn" onclick="prevCard()" title="Sebelumnya">◀</button>
  <button class="flip-btn nav-btn" onclick="flipCard()">Balik Kartu</button>
  <button class="nav-btn" onclick="nextCard()" title="Berikutnya">▶</button>
</div>

<!-- RATING -->
<div class="rating-row">
  <button class="rate-btn dunno" onclick="rateCard(false)">❌ Belum Hafal</button>
  <button class="rate-btn know"  onclick="rateCard(true)">✅ Sudah Hafal</button>
</div>

<!-- DONE SCREEN -->
<div id="doneScreen">
  <div class="done-emoji">🎉</div>
  <div class="done-title">Selesai!</div>
  <div class="done-score">Hafal: <strong id="doneKnow">0</strong> dari <span id="doneTotal">0</span> kartu</div>
  <div class="done-btns">
    <button class="done-btn retry" onclick="retryAll()">🔄 Ulangi Semua</button>
    <button class="done-btn review" onclick="reviewUnknown()">❌ Ulangi Belum Hafal</button>
  </div>
</div>

// ══════════════════════════════
// STATE
// ══════════════════════════════
let deck = [...ALL_VOCAB];
let current = 0;
let isFlipped = false;
let showIdFirst = false; // false = show JP front
let filterKey = 'all';
let knowSet = new Set();
let dunnoSet = new Set();

// ══════════════════════════════
// FILTER
// ══════════════════════════════
function setFilter(key, btn) {
  filterKey = key;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildDeck();
}

function buildDeck() {
  if (filterKey === 'all') {
    deck = [...ALL_VOCAB];
  } else if (filterKey === 'dunno') {
    deck = ALL_VOCAB.filter((_, i) => dunnoSet.has(i));
    if (deck.length === 0) {
      deck = [...ALL_VOCAB];
      alert('Belum ada kata yang ditandai ❌. Tampilkan semua dulu!');
    }
  } else {
    deck = ALL_VOCAB.filter(v => v.day.startsWith(filterKey));
  }
  current = 0;
  isFlipped = false;
  document.getElementById('cardWrap').classList.remove('flipped');
  renderCard();
}

// ══════════════════════════════
// SHUFFLE
// ══════════════════════════════
function shuffleDeck() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  current = 0;
  isFlipped = false;
  document.getElementById('cardWrap').classList.remove('flipped');
  renderCard();
}

// ══════════════════════════════
// FLIP / NAV
// ══════════════════════════════
function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('cardWrap').classList.toggle('flipped', isFlipped);
}

function prevCard() {
  if (current > 0) {
    current--;
    isFlipped = false;
    document.getElementById('cardWrap').classList.remove('flipped');
    renderCard();
  }
}

function nextCard() {
  if (current < deck.length - 1) {
    current++;
    isFlipped = false;
    document.getElementById('cardWrap').classList.remove('flipped');
    renderCard();
  } else {
    showDone();
  }
}

// ══════════════════════════════
// RATING
// ══════════════════════════════
function rateCard(known) {
  const globalIdx = ALL_VOCAB.indexOf(deck[current]);
  if (known) {
    knowSet.add(globalIdx);
    dunnoSet.delete(globalIdx);
  } else {
    dunnoSet.add(globalIdx);
    knowSet.delete(globalIdx);
  }
  updateStats();
  nextCard();
}

function updateStats() {
  document.getElementById('statKnow').textContent = knowSet.size;
  document.getElementById('statDunno').textContent = dunnoSet.size;
  document.getElementById('statRemain').textContent = deck.length - current - 1;
}

// ══════════════════════════════
// RENDER
// ══════════════════════════════
function renderCard() {
  const v = deck[current];
  const total = deck.length;

  // progress
  document.getElementById('progFill').style.width = ((current + 1) / total * 100) + '%';
  document.getElementById('cardNum').textContent = current + 1;
  document.getElementById('cardTotal').textContent = total;

  // front
  document.getElementById('frontDay').textContent = v.day;
  if (!showIdFirst) {
    document.getElementById('frontJp').textContent = v.jp;
    document.getElementById('frontRead').textContent = v.read;
  } else {
    document.getElementById('frontJp').textContent = v.id;
    document.getElementById('frontRead').textContent = '';
  }

  // back
  document.getElementById('backDay').textContent = v.day;
  if (!showIdFirst) {
    document.getElementById('backId').textContent = v.id;
    document.getElementById('backJp').textContent = v.jp;
    document.getElementById('backRead').textContent = v.read;
  } else {
    document.getElementById('backId').textContent = v.jp;
    document.getElementById('backJp').textContent = v.read;
    document.getElementById('backRead').textContent = '';
  }

  // animate
  const wrap = document.getElementById('cardWrap');
  wrap.classList.remove('card-enter');
  void wrap.offsetWidth;
  wrap.classList.add('card-enter');

  updateStats();
}

// ══════════════════════════════
// MODE TOGGLE
// ══════════════════════════════
function toggleMode() {
  showIdFirst = !showIdFirst;
  document.getElementById('modeLabel').textContent = showIdFirst ? 'Tampilkan ID' : 'Tampilkan JP';
  isFlipped = false;
  document.getElementById('cardWrap').classList.remove('flipped');
  renderCard();
}

// ══════════════════════════════
// DONE / RETRY
// ══════════════════════════════
function showDone() {
  document.getElementById('doneKnow').textContent = knowSet.size;
  document.getElementById('doneTotal').textContent = deck.length;
  document.getElementById('doneScreen').classList.add('show');
}

function retryAll() {
  document.getElementById('doneScreen').classList.remove('show');
  knowSet.clear(); dunnoSet.clear();
  buildDeck();
}

function reviewUnknown() {
  document.getElementById('doneScreen').classList.remove('show');
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  filterKey = 'dunno';
  buildDeck();
}

// ══════════════════════════════
// KEYBOARD
// ══════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'l') nextCard();
  if (e.key === 'ArrowLeft'  || e.key === 'h') prevCard();
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
  if (e.key === 'y') rateCard(true);
  if (e.key === 'n') rateCard(false);
});

// ══════════════════════════════
// SWIPE
// ══════════════════════════════
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
    if (dx < 0) nextCard();
    else prevCard();
  }
}, {passive:true});

// INIT
renderCard();
</script>
</body>
</html>
